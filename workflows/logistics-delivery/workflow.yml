schema_version: "1.0"
workflow:
  id: "logistics-delivery"
  name: "Entrega Logística com Gates"
  version: "1.0.0"
  author: "Sistema de Logística"
  description: "Fluxo Spec Kit para especificar, planejar, validar e implementar mudanças com revisão humana."

requires:
  speckit_version: ">=0.8.5"

inputs:
  spec:
    type: string
    required: true
    prompt: "Descreva a funcionalidade ou correção"
  integration:
    type: string
    default: "auto"
    prompt: "Integração ativa do agente; auto usa a integração configurada"

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Revise a especificação, incluindo regras de lucro, KM e manutenção, antes do planejamento."
    options: [approve, reject]
    on_reject: abort

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Aprove o plano técnico, modelo de dados e contratos antes das tarefas."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-tasks
    type: gate
    message: "Aprove as tarefas e a análise de consistência antes de implementar."
    options: [approve, reject]
    on_reject: abort

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"
