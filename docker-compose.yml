services:
  # Fonte de verdade do domínio. A porta publicada existe para administração local via DBeaver.
  postgres:
    image: postgres:18-alpine
    container_name: logistica-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logistica}
      POSTGRES_USER: ${POSTGRES_USER:-logistica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatória}
      DOMAIN_APP_USER: ${DOMAIN_APP_USER:-logistica_app}
      DOMAIN_APP_PASSWORD: ${DOMAIN_APP_PASSWORD:?DOMAIN_APP_PASSWORD obrigatória}
      METABASE_APP_USER: ${METABASE_APP_USER:-metabase_app}
      METABASE_APP_PASSWORD: ${METABASE_APP_PASSWORD:?METABASE_APP_PASSWORD obrigatória}
      METABASE_BI_USER: ${METABASE_BI_USER:-metabase_bi}
      METABASE_BI_PASSWORD: ${METABASE_BI_PASSWORD:?METABASE_BI_PASSWORD obrigatória}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./infra/postgres/init-bi.sh:/docker-entrypoint-initdb.d/20-init-bi.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  database-init:
    image: postgres:18-alpine
    environment:
      PGHOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-logistica}
      POSTGRES_USER: ${POSTGRES_USER:-logistica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatória}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatória}
      DOMAIN_APP_USER: ${DOMAIN_APP_USER:-logistica_app}
      DOMAIN_APP_PASSWORD: ${DOMAIN_APP_PASSWORD:?DOMAIN_APP_PASSWORD obrigatória}
      METABASE_APP_USER: ${METABASE_APP_USER:-metabase_app}
      METABASE_APP_PASSWORD: ${METABASE_APP_PASSWORD:?METABASE_APP_PASSWORD obrigatória}
      METABASE_APP_DB: ${METABASE_APP_DB:-metabase}
      METABASE_BI_USER: ${METABASE_BI_USER:-metabase_bi}
      METABASE_BI_PASSWORD: ${METABASE_BI_PASSWORD:?METABASE_BI_PASSWORD obrigatória}
    volumes:
      - ./infra/postgres/init-bi.sh:/opt/logistica/init-roles.sh:ro
    command: ["/bin/sh", "/opt/logistica/init-roles.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  api:
    build:
      context: ./backend
      target: runtime
    container_name: logistica-api
    environment:
      DATABASE_URL: postgresql+psycopg://${DOMAIN_APP_USER:-logistica_app}:${DOMAIN_APP_PASSWORD:?DOMAIN_APP_PASSWORD obrigatória}@postgres:5432/${POSTGRES_DB:-logistica}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      BASE_FUEL_PRICE_PER_LITER: ${BASE_FUEL_PRICE_PER_LITER:-6.00}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY obrigatória}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      OAUTH_COOKIE_SECURE: "false"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      VEHICLE_CATALOG_CSV_URL: ${VEHICLE_CATALOG_CSV_URL:-https://docs.google.com/spreadsheets/d/1aLlhNvD3K0ztU9Rq-x7yKnLryoCGCF4lhxswHvsyG5I/export?format=csv&gid=1122938118}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal, public]

  api-tests:
    build:
      context: ./backend
      target: test
    profiles: [test]
    # Executa contra a revisão atual e preserva os contratos que inspecionam
    # frontend, infraestrutura e documentação na raiz do repositório.
    working_dir: /workspace/backend
    volumes:
      - .:/workspace:ro
    environment:
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      PYTHONPATH: /workspace/backend

  # Espelha a referência técnica externa sem alterar o estado dos veículos operacionais.
  catalog-sync:
    build:
      context: ./backend
      target: runtime
    container_name: logistica-catalog-sync
    command: ["python", "-m", "app.catalog_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${DOMAIN_APP_USER:-logistica_app}:${DOMAIN_APP_PASSWORD:?DOMAIN_APP_PASSWORD obrigatória}@postgres:5432/${POSTGRES_DB:-logistica}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY obrigatória}
      VEHICLE_CATALOG_CSV_URL: ${VEHICLE_CATALOG_CSV_URL:-https://docs.google.com/spreadsheets/d/1aLlhNvD3K0ztU9Rq-x7yKnLryoCGCF4lhxswHvsyG5I/export?format=csv&gid=1122938118}
      CATALOG_SYNC_INTERVAL_SECONDS: ${CATALOG_SYNC_INTERVAL_SECONDS:-3600}
    depends_on:
      postgres:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [internal, public]

  outbox-worker:
    build:
      context: ./backend
      target: runtime
    container_name: logistica-outbox-worker
    command: ["python", "-m", "app.outbox_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${DOMAIN_APP_USER:-logistica_app}:${DOMAIN_APP_PASSWORD:?DOMAIN_APP_PASSWORD obrigatória}@postgres:5432/${POSTGRES_DB:-logistica}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY obrigatória}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [internal]

  n8n:
    image: n8nio/n8n:1.116.2
    container_name: logistica-n8n
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY obrigatória}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [internal, public]

  # Ferramenta administrativa local; não é uma interface tenant-facing.
  metabase:
    image: metabase/metabase:v0.58.7
    container_name: logistica-metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_APP_DB:-metabase}
      MB_DB_PORT: 5432
      MB_DB_USER: ${METABASE_APP_USER:-metabase_app}
      MB_DB_PASS: ${METABASE_APP_PASSWORD:?METABASE_APP_PASSWORD obrigatória}
      MB_DB_HOST: postgres
    ports:
      - "127.0.0.1:${METABASE_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    container_name: logistica-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks: [public]

volumes:
  postgres18_data:
  n8n_data:

networks:
  public:
  internal:
    internal: true
