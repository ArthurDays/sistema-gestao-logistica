name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # O projeto ainda não é empacotado como wheel; expõe backend/app aos testes no runner.
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate managed hosting contract
        run: >-
          pwsh -File ../infra/hosting/validate-production-config.ps1
          -Path ../infra/hosting/production.env.example
      - name: Run backend and production contract tests
        run: pytest
      - name: Lint backend
        run: ruff check app tests
      - name: Type-check backend
        run: mypy app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Type-check frontend
        run: npm run test
      - name: Build Netlify static export
        run: npm run build
        env:
          NETLIFY_STATIC_EXPORT: "true"
